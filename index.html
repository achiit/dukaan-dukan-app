<style>
:root{--bgg:linear-gradient(160deg,#cfe0ff 0%,#eaf2ff 38%,#f8fbff 68%,#d9e7ff 100%);--card:#fff;--bg:#f3f6fc;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f4;--ac:#2563eb;--g:linear-gradient(135deg,#2563eb,#4f46e5);padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bgg:linear-gradient(160deg,#0a1226 0%,#101c38 55%,#0b1220 100%);--card:#121a2e;--bg:#0b1220;--tx:#f1f5f9;--mu:#94a3b8;--bd:#24304a}}
*{box-sizing:border-box}html{background:var(--bgg) fixed;min-height:100%}body{margin:0;min-height:100vh;color:var(--tx);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}h3{font-size:14px;margin:12px 0 6px}
.a{max-width:560px;margin:0 auto;padding:10px 10px 96px}
.hd{background:linear-gradient(var(--card),var(--card)) padding-box,var(--g) border-box;border:1.5px solid transparent;box-shadow:0 8px 22px rgba(37,99,235,.12);border-radius:18px;padding:12px 14px;margin-bottom:8px}
.hd h1{margin:0;font-size:17px}small{color:var(--mu);display:block}
select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;max-width:100%}
button{font:inherit;border:1px solid var(--bd);border-radius:10px;padding:8px 12px;background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--g);color:#fff;border-color:transparent}button.g{background:#16a34a;color:#fff;border-color:#16a34a}button.r{background:#dc2626;color:#fff;border-color:#dc2626}.w{width:100%;margin:4px 0}.on{background:var(--g);color:#fff;border-color:transparent}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:9px 11px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(37,99,235,.12);z-index:5}
.nav button{flex:1;border:0;background:none;color:var(--mu);font-size:10.5px;font-weight:600;padding:8px 0 6px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px}.nav button.on{color:#fff;background:var(--g)}
.rw{display:flex;gap:8px;align-items:center;margin:5px 0;width:100%}.rw input,.rw select{flex:1;min-width:0}.q{display:flex;gap:6px;align-items:center}.q input{width:64px;text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}.sb{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}.sb input,.sb select{width:100%;margin:4px 0}
.au{max-width:420px;margin:0 auto;padding:36px 16px}.au h1{font-size:24px;margin:10px 0 4px}.au input{width:100%;margin:5px 0}.er{color:#dc2626;font-size:13px;min-height:18px}
.neg{color:#dc2626}.pos{color:#16a34a}.mt{display:flex;gap:6px;margin:8px 0}.mt button{flex:1;padding:8px 4px}
#t{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:99px;display:none;font-size:13px;max-width:90%;text-align:center;z-index:20}

function add(id){const l=cart.find(x=>x.id==id);if(l)l.q=r3(l.q+1);else cart.push({id,q:1});render()}
function cq(id,d){const l=cart.find(x=>x.id==id);l.q=r3(l.q+d);if(l.q<=0)cart=cart.filter(x=>x.id!=id);render()}
function cset(id,v){const q=parseFloat(v);cart=q>0?cart.map(x=>x.id==id?{id,q:r3(q)}:x):cart.filter(x=>x.id!=id);render()}
function bill(){const t=tot();return `<input id="bsr" placeholder="Search item, category or barcode" value="${E(bs)}" oninput="bs=this.value;$('#bl').innerHTML=blist()" style="width:100%"><div id="bl" style="margin-top:6px">${blist()}</div><h3>Cart (${cart.length})</h3>`+(cart.map(l=>{const it=gi(l.id);return `<div class="c"><div><b>${E(it.n)}</b><small>${R(it.s)} × ${l.q} ${E(it.u)} = ${R(Math.round(it.s*l.q))}${it.q<l.q?` <span class="neg">• low stock</span>`:""}</small></div><div class="q"><button onclick="cq(${l.id},-1)">−</button><input type="number" step="any" value="${l.q}" onchange="cset(${l.id},this.value)"><button onclick="cq(${l.id},1)">+</button></div></div>`}).join("")||`<div class="c"><small>Cart is empty. Tap an item above.</small></div>`)+
`<div class="c"><span>Discount ₹</span><input id="bd" type="number" step="any" value="${E(bdisc)}" oninput="bdisc=this.value;render()" style="width:110px"></div><div class="c"><b>Total</b><b style="font-size:20px">${R(t)}</b></div>
<div class="mt">${[["cash","Cash"],["upi","UPI"],["udhaar","Udhaar"],["part","Part"]].map(x=>`<button class="${bmode==x[0]?"on":""}" onclick="bmode='${x[0]}';render()">${x[1]}</button>`).join("")}</div>`+(bmode=="part"?`<div class="c"><span>Paid now ₹</span><input id="bpd" type="number" step="any" value="${E(bpaid)}" oninput="bpaid=this.value" style="width:110px"></div>`:"")+
(bmode=="udhaar"||bmode=="part"?`<div class="rw"><select id="bcu" onchange="bcid=this.value"><option value="">Select customer</option>${D.cust.map(c=>`<option value="${c.id}" ${c.id==bcid?"selected":""}>${E(c.n)}</option>`).join("")}</select><button onclick="custSheet(0,1)">+ New</button></div>`:`<div class="rw"><select id="bcu" onchange="bcid=this.value"><option value="">Walk-in customer</option>${D.cust.map(c=>`<option value="${c.id}" ${c.id==bcid?"selected":""}>${E(c.n)}</option>`).join("")}</select></div>`)+
`<button class="p w" onclick="saveBill()" style="padding:12px">Save bill ${R(t)}</button>`}
function saveBill(){if(!cart.length)return toast("Cart is empty");const total=tot(),disc=Math.min(P(bdisc),sub());let cash=0,upi=0,ud=0;if(bmode=="cash")cash=total;else if(bmode=="upi")upi=total;else if(bmode=="udhaar")ud=total;else{const pd=Math.min(total,P(bpaid));cash=pd;ud=total-pd}
if(ud>0&&!bcid)return toast("Select a customer for udhaar");const b={id:D.nid++,no:D.seq++,t:Date.now(),lines:cart.map(l=>{const it=gi(l.id);return{id:it.id,n:it.n,u:it.u,q:l.q,p:it.s,b:it.b}}),disc,total,cash,upi,ud,cid:bcid?+bcid:0};
cart.forEach(l=>{const it=gi(l.id);it.q=r3(it.q-l.q)});D.bills.push(b);if(ud>0)D.led.push({id:D.nid++,cid:b.cid,t:b.t,type:"udhaar",amt:ud,note:"Bill #"+b.no,bid:b.id}),gc(b.cid).bal+=ud;save();cart=[];bdisc="";bpaid="";bmode="cash";bcid="";bs="";render();showBill(b.id,1)}
function btext(b){const c=b.cid?gc(b.cid):null;return `*${D.store.name}*\nBill #${b.no} • ${dt(b.t)}\n`+b.lines.map(l=>`${l.n} ${l.q} ${l.u} × ${R(l.p)} = ${R(Math.round(l.p*l.q))}`).join("\n")+`\n${b.disc?"Discount: "+R(b.disc)+"\n":""}*Total: ${R(b.total)}*\nPaid: ${R(b.cash+b.upi)}${b.ud?"\nUdhaar: "+R(b.ud)+(c?" (Balance "+R(c.bal)+")":""):""}\nThank you! Visit again.`}
function showBill(id,fresh){const b=D.bills.find(x=>x.id==id);if(!b)return;const c=b.cid?gc(b.cid):null;sheet(`<h3 style="margin:0">${fresh?"Bill saved":"Bill"} #${b.no}</h3><small>${dt(b.t)}${c?" • "+E(c.n):""}</small>${b.lines.map(l=>`<div class="rw"><span style="flex:1">${E(l.n)} ${l.q} ${E(l.u)}</span><b>${R(Math.round(l.p*l.q))}</b></div>`).join("")}${b.disc?`<div class="rw"><span style="flex:1">Discount</span><b>-${R(b.disc)}</b></div>`:""}<div class="rw"><b style="flex:1">Total</b><b>${R(b.total)}</b></div><small>Cash ${R(b.cash)} • UPI ${R(b.upi)} • Udhaar ${R(b.ud)}</small><button class="g w" onclick="wa('${c?c.ph:""}',btext(D.bills.find(x=>x.id==${b.id})))">Share on WhatsApp</button>${fresh?"":`<button class="r w" onclick="ask('Delete this bill? Stock and udhaar are restored.','delBill(${b.id})')">Delete bill</button>`}<button class="w" onclick="sheet()">Close</button>`)}
function delBill(id){const b=D.bills.find(x=>x.id==id);b.lines.forEach(l=>{const it=gi(l.id);if(it)it.q=r3(it.q+l.q)});if(b.ud&&b.cid){const c=gc(b.cid);if(c)c.bal-=b.ud}D.led=D.led.filter(x=>x.bid!=id);D.bills=D.bills.filter(x=>x.id!=id);save();toast("Bill deleted");render()}
/* ---------- items ---------- */
const U=["pcs","kg","g","litre","packet","dozen"];
function ilist(){const q=is.toLowerCase().trim();return D.items.filter(x=>!q||(x.n+" "+(x.bc||"")+" "+(x.c||"")).toLowerCase().includes(q)).map(x=>`<div class="c" onclick="itemSheet(${x.id})" style="cursor:pointer"><div><b>${E(x.n)}</b><small>Buy ${R(x.b)} • Sell ${R(x.s)}${x.c?" • "+E(x.c):""}</small></div><div style="text-align:right"><b class="${x.q<=x.m?"neg":""}">${x.q} ${E(x.u)}</b>${x.q<=x.m?`<small class="neg">Low stock</small>`:""}</div></div>`).join("")||`<div class="c"><small>No items yet</small></div>`}
function items(){return `<div class="rw"><input id="isr" placeholder="Search items" value="${E(is)}" oninput="is=this.value;$('#il').innerHTML=ilist()"><button class="p" onclick="itemSheet(0)">+ Item</button></div><div id="il">${ilist()}</div>`+(D.items.length?"":`<button class="w" onclick="sample()">Add 6 sample items</button>`)}
function itemSheet(id){const x=id?gi(id):{n:"",u:"pcs",b:0,s:0,q:0,m:5,c:"",bc:""};sheet(`<h3 style="margin:0 0 6px">${id?"Edit item":"New item"}</h3><input id="fn" placeholder="Item name" value="${E(x.n)}"><div class="rw"><select id="fu">${U.map(u=>`<option ${u==x.u?"selected":""}>${u}</option>`).join("")}</select><input id="fc" placeholder="Category" value="${E(x.c)}"></div><div class="rw"><input id="fb" type="number" step="any" placeholder="Buy price ₹" value="${x.b?x.b/100:""}"><input id="fs" type="number" step="any" placeholder="Sell price ₹" value="${x.s?x.s/100:""}"></div><div class="rw"><input id="fq" type="number" step="any" placeholder="Stock" value="${x.q||""}"><input id="fm" type="number" step="any" placeholder="Low stock at" value="${x.m}"></div><input id="fk" placeholder="Barcode (optional)" value="${E(x.bc)}"><div class="er" id="er2"></div><button class="p w" onclick="saveItem(${id})">Save item</button>${id?`<button class="r w" onclick="ask('Delete this item?','delItem(${id})')">Delete</button>`:""}`)}
function saveItem(id){const n=$("#fn").value.trim(),s=P($("#fs").value);if(!n||!s)return $("#er2").textContent="Enter item name and sell price";const o={n,u:$("#fu").value,c:$("#fc").value.trim(),b:P($("#fb").value),s,q:parseFloat($("#fq").value)||0,m:parseFloat($("#fm").value)||0,bc:$("#fk").value.trim()};if(id)Object.assign(gi(id),o);else D.items.push({id:D.nid++,...o});save();sheet();toast("Item saved");render()}
function delItem(id){D.items=D.items.filter(x=>x.id!=id);cart=cart.filter(x=>x.id!=id);save();render()}
function sample(){[["Rice","kg",4800,5500,50,"Grains"],["Atta","kg",3600,4200,40,"Grains"],["Sugar","kg",4000,4500,30,"Grains"],["Toor Dal","kg",11000,13000,20,"Pulses"],["Tea 250g","packet",9000,11000,15,"Tea"],["Biscuit","packet",800,1000,40,"Snacks"]].forEach(a=>D.items.push({id:D.nid++,n:a[0],u:a[1],b:a[2],s:a[3],q:a[4],m:5,c:a[5],bc:""}));save();render()}
/* ---------- khata ---------- */
const owe=()=>D.cust.reduce((a,c)=>a+Math.max(0,c.bal),0);
function clist(){const q=cs.toLowerCase().trim();return D.cust.filter(c=>!q||(c.n+c.ph).toLowerCase().includes(q)).sort((a,b)=>b.bal-a.bal).map(c=>`<div class="c" onclick="custSheet(${c.id})" style="cursor:pointer"><div><b>${E(c.n)}</b><small>${E(c.ph||"No number")}</small></div><b class="${c.bal>0?"neg":"pos"}">${c.bal>0?"Due ":c.bal<0?"Advance ":""}${R(Math.abs(c.bal))}</b></div>`).join("")||`<div class="c"><small>No customers yet</small></div>`}
function khata(){return `<div class="k"><div>Total udhaar<br><b>${R(owe())}</b></div><div>Customers<br><b>${D.cust.length}</b></div></div><div class="rw"><input id="csr" placeholder="Search customer" value="${E(cs)}" oninput="cs=this.value;$('#cl').innerHTML=clist()"><button class="p" onclick="custSheet(0)">+ Add</button></div><div id="cl">${clist()}</div>`}
function custSheet(id,fromBill){if(!id)return sheet(`<h3 style="margin:0 0 6px">New customer</h3><input id="cn" placeholder="Customer name"><input id="cp" inputmode="numeric" maxlength="10" placeholder="Mobile number (for reminders)"><div class="er" id="er2"></div><button class="p w" onclick="saveCust(${fromBill?1:0})">Save customer</button>`);
const c=gc(id),L=D.led.filter(x=>x.cid==id).sort((a,b)=>b.t-a.t).slice(0,15);sheet(`<h3 style="margin:0">${E(c.n)}</h3><small>${E(c.ph||"No number")}</small><div class="c" style="margin-top:8px"><b>Balance</b><b class="${c.bal>0?"neg":"pos"}" style="font-size:19px">${c.bal>0?"Due ":""}${R(Math.abs(c.bal))}</b></div><div class="rw"><input id="la" type="number" step="any" placeholder="Amount ₹"><button class="g" onclick="led(${id},'jama')">Received</button><button onclick="led(${id},'udhaar')">Udhaar</button></div><button class="g w" onclick="remind(${id})">WhatsApp reminder</button><h3>History</h3>${L.map(x=>`<div class="rw"><span style="flex:1">${dt(x.t)}<small>${E(x.note||"")}</small></span><b class="${x.type=="jama"?"pos":"neg"}">${x.type=="jama"?"+":"-"}${R(x.amt)}</b></div>`).join("")||"<small>No entries</small>"}${c.bal==0?`<button class="r w" onclick="ask('Delete this customer?','delCust(${id})')">Delete customer</button>`:""}<button class="w" onclick="sheet()">Close</button>`)}
function saveCust(fb){const n=$("#cn").value.trim(),p=$("#cp").value.trim();if(!n)return $("#er2").textContent="Enter customer name";if(p&&!/^\d{10}$/.test(p))return $("#er2").textContent="Mobile must be 10 digits";const c={id:D.nid++,n,ph:p,bal:0};D.cust.push(c);if(fb)bcid=String(c.id);save();sheet();toast("Customer added");render()}
function led(id,type){const a=P($("#la").value);if(a<=0)return toast("Enter an amount");const c=gc(id);c.bal+=type=="udhaar"?a:-a;D.led.push({id:D.nid++,cid:id,t:Date.now(),type,amt:a,note:type=="jama"?"Payment received":"Manual udhaar"});save();render();custSheet(id)}
function remind(id){const c=gc(id);wa(c.ph,`Dear ${c.n}, a gentle reminder from ${D.store.name}: your pending balance is ${R(Math.max(0,c.bal))}. Kindly pay at your convenience. Thank you.`)}
function delCust(id){D.cust=D.cust.filter(c=>c.id!=id);save();render()}
/* ---------- home / more ---------- */
const since=r=>{const d=new Date();if(r=="today")d.setHours(0,0,0,0);else if(r=="month"){d.setDate(1);d.setHours(0,0,0,0)}else return 0;return d.getTime()};
const cost=b=>b.lines.reduce((a,l)=>a+Math.round(l.b*l.q),0),inR=r=>D.bills.filter(b=>b.t>=since(r));
function home(){const B=inR("today"),s=B.reduce((a,b)=>a+b.total,0),p=B.reduce((a,b)=>a+b.total-cost(b),0),low=D.items.filter(x=>x.q<=x.m).length;
return `<button class="p w" style="padding:14px;font-size:16px" onclick="tab='bill';render()">New bill</button><div class="k"><div>Today's sales<br><b>${R(s)}</b><small>${B.length} bills</small></div><div>Today's profit<br><b>${R(p)}</b></div><div>Total udhaar<br><b>${R(owe())}</b></div><div>Low stock<br><b>${low}</b><small>items</small></div></div><h3>Recent bills</h3>`+D.bills.slice(-5).reverse().map(b=>`<div class="c" onclick="showBill(${b.id})" style="cursor:pointer"><div><b>Bill #${b.no}</b><small>${dt(b.t)}${b.cid?" • "+E((gc(b.cid)||{n:""}).n):""}</small></div><b>${R(b.total)}</b></div>`).join("")||`<div class="c"><small>No bills yet. Tap New bill.</small></div>`}
function more(){if(msub=="rep")return back()+reports();if(msub=="bills")return back()+`<h3>All bills</h3>`+D.bills.slice().reverse().map(b=>`<div class="c" onclick="showBill(${b.id})" style="cursor:pointer"><div><b>Bill #${b.no}</b><small>${dt(b.t)}</small></div><b>${R(b.total)}</b></div>`).join("")||"<small>No bills</small>";if(msub=="set")return back()+settings();
const m=(k,t,d)=>`<div class="c" onclick="msub='${k}';render()" style="cursor:pointer"><div><b>${t}</b><small>${d}</small></div></div>`;return m("rep","Reports","Sales, profit, top items, low stock")+m("bills","All bills","View or delete old bills")+m("set","Settings and backup","Shop details, PIN, backup, reset")+`<button class="w" onclick="lock()">Lock app</button>`+(DIP?`<button class="w" onclick="DIP.prompt()">Install KiranaDesk on this phone</button>`:`<small style="margin-top:8px">To install: Chrome menu > Install app, or Add to Home screen.</small>`)}
const back=()=>`<button onclick="msub='';render()" style="margin-bottom:6px">← Back</button>`;
function reports(){const B=inR(rng),s=B.reduce((a,b)=>a+b.total,0),c=B.reduce((a,b)=>a+cost(b),0),m={};B.forEach(b=>b.lines.forEach(l=>m[l.n]=(m[l.n]||0)+l.q));const top=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5),low=D.items.filter(x=>x.q<=x.m);
return `<div class="mt">${[["today","Today"],["month","This month"],["all","All"]].map(x=>`<button class="${rng==x[0]?"on":""}" onclick="rng='${x[0]}';render()">${x[1]}</button>`).join("")}</div><div class="k"><div>Sales<br><b>${R(s)}</b><small>${B.length} bills</small></div><div>Profit<br><b>${R(s-c)}</b></div><div>Cash<br><b>${R(B.reduce((a,b)=>a+b.cash,0))}</b></div><div>UPI<br><b>${R(B.reduce((a,b)=>a+b.upi,0))}</b></div><div>Udhaar given<br><b>${R(B.reduce((a,b)=>a+b.ud,0))}</b></div><div>Stock value<br><b>${R(D.items.reduce((a,x)=>a+Math.round(x.b*Math.max(0,x.q)),0))}</b></div></div><h3>Top items</h3>`+(top.map(t=>`<div class="c"><b>${E(t[0])}</b><b>${r3(t[1])}</b></div>`).join("")||`<div class="c"><small>No sales yet</small></div>`)+`<h3>Low stock</h3>`+(low.map(x=>`<div class="c"><b>${E(x.n)}</b><b class="neg">${x.q} ${E(x.u)}</b></div>`).join("")||`<div class="c"><small>All good</small></div>`)}
function settings(){const s=D.store;return `<div class="c" style="display:block"><b>Shop details</b><input id="en" value="${E(s.name)}" placeholder="Shop name" style="width:100%;margin-top:6px"><input id="eo" value="${E(s.owner)}" placeholder="Owner name" style="width:100%;margin-top:6px"><input id="ep" value="${E(s.phone)}" placeholder="Mobile" style="width:100%;margin-top:6px"><button class="p w" onclick="saveSet()">Save</button></div><div class="c" style="display:block"><b>Change PIN</b><input id="op" type="password" inputmode="numeric" maxlength="4" placeholder="Old PIN" style="width:100%;margin-top:6px"><input id="np" type="password" inputmode="numeric" maxlength="4" placeholder="New 4-digit PIN" style="width:100%;margin-top:6px"><button class="p w" onclick="chPin()">Update PIN</button></div><div class="c" style="display:block"><b>Backup</b><small>Your data is on this phone only. Save a backup often.</small><button class="w" onclick="backup()">Download backup</button><button class="w" onclick="copyB()">Copy backup text</button><input id="rf" type="file" accept=".json,application/json" onchange="restore(this)" style="width:100%;margin-top:6px"></div><button class="r w" onclick="ask('Erase ALL data on this phone? This cannot be undone.','reset()')">Erase all data</button>`}
function saveSet(){const n=$("#en").value.trim(),o=$("#eo").value.trim(),p=$("#ep").value.trim();if(!n||!o)return toast("Enter shop and owner name");Object.assign(D.store,{name:n,owner:o,phone:p});save();toast("Saved");render()}
function chPin(){if($("#op").value!==D.store.pin)return toast("Old PIN is wrong");if(!/^\d{4}$/.test($("#np").value))return toast("New PIN must be 4 digits");D.store.pin=$("#np").value;save();toast("PIN changed");render()}
function backup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:"application/json"}));a.download="kiranadesk-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();toast("Backup downloaded")}
function copyB(){try{navigator.clipboard.writeText(JSON.stringify(D));toast("Backup copied")}catch(e){toast("Could not copy")}}
function restore(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.store||!d.items)throw 0;D=d;save();toast("Backup restored");render()}catch(e){toast("This is not a valid backup file")}};r.readAsText(f)}
function reset(){try{localStorage.removeItem(KEY);sessionStorage.removeItem("kd_u")}catch(e){}D=null;unlocked=false;cart=[];tab="home";msub="";render()}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();DIP=e;if(unlocked&&tab=="more")render()});
render();
</script></body></html>
